name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Kaappi
        run: |
          git clone --depth 1 https://github.com/kaappi/kaappi.git /tmp/kaappi
          cd /tmp/kaappi && zig build

      - name: Run tests
        run: /tmp/kaappi/zig-out/bin/kaappi --coverage-xml coverage.xml --lib-path lib tests/test-cli.scm

      - name: Upload to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false

  # The library, suite and example are R7RS-small only. Kaappi resolves
  # bindings from libraries a file did not import, so it cannot catch a
  # missing import; Chibi enforces import partitioning and can.
  r7rs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Chibi Scheme
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chibi-scheme

      - name: Run tests under Chibi
        run: chibi-scheme -I lib tests/test-cli.scm

      - name: Run the example under Chibi
        run: |
          chibi-scheme -I lib examples/greeter.scm -l Bob
          chibi-scheme -I lib examples/greeter.scm farewell
